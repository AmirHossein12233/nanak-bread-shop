<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل مدیریت نانک</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f1ea;
            color: #2d241c;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.12);
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .input {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        .input:focus {
            border-color: #c47a2c;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #c47a2c;
            color: white;
        }

        .btn-primary:hover {
            background: #a96120;
        }

        .error {
            color: #c62828;
            margin-top: 12px;
            min-height: 20px;
        }

        .dashboard {
            display: none;
            min-height: 100vh;
        }

        .header {
            background: #3b291d;
            color: white;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-title {
            font-size: 23px;
            font-weight: bold;
        }

        .logout {
            background: #b83232;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .stat-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .section-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
        }

        .product-price {
            color: #c47a2c;
            margin-top: 7px;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 8px;
        }

        .available {
            background: #e6f6e9;
            color: #19702b;
        }

        .unavailable {
            background: #fde7e7;
            color: #a52222;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small-btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .green {
            background: #2e7d32;
            color: white;
        }

        .orange {
            background: #c47a2c;
            color: white;
        }

        .blue {
            background: #2468b5;
            color: white;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order {
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 18px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .order-number {
            font-weight: bold;
        }

        .order-status {
            border-radius: 20px;
            padding: 6px 12px;
            background: #fff1dc;
            color: #9a5a16;
            font-size: 13px;
        }

        .order-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            color: #555;
        }

        .order-total {
            font-size: 18px;
            font-weight: bold;
            color: #c47a2c;
            margin-top: 12px;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        textarea.input {
            min-height: 90px;
            resize: vertical;
        }

        .sale-total {
            background: #fff7eb;
            border-radius: 14px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #9a5a16;
        }

        .message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #256b2b;
        }

        .message.error {
            display: block;
            background: #ffebee;
            color: #b71c1c;
        }

        .refresh {
            background: #444;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .order-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .header {
                padding: 15px;
            }

            .header-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">🍞</div>

        <h1>پنل مدیریت نانک</h1>

        <div class="subtitle">
            مدیریت فروشگاه نانک
        </div>

        <input
            id="passwordInput"
            class="input"
            type="password"
            placeholder="رمز مدیریت"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="btn btn-primary"
        >
            ورود به پنل
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<div id="dashboard" class="dashboard">

    <header class="header">

        <div class="header-title">
            🍞 پنل مدیریت نانک
        </div>

        <button
            id="logoutButton"
            class="logout"
        >
            خروج
        </button>

    </header>


    <main class="container">

        <div id="message" class="message"></div>


        <section class="stats">

            <div class="stat">
                <div class="stat-title">
                    کل سفارش‌ها
                </div>

                <div
                    id="totalOrders"
                    class="stat-value"
                >
                    ۰
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    سفارش‌های جدید
                </div>

                <div
                    id="newOrders"
                    class="stat-value"
                >
                    ۰
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    فروش ثبت‌شده
                </div>

                <div
                    id="totalSales"
                    class="stat-value"
                >
                    ۰
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    مبلغ کل فروش
                </div>

                <div
                    id="totalMoney"
                    class="stat-value"
                >
                    ۰
                </div>
            </div>

        </section>


        <section class="section">

            <div class="section-title">
                📦 مدیریت محصول
            </div>

            <div id="productsList"></div>

        </section>


        <section class="section">

            <div class="section-title">
                🛒 سفارش‌های مشتریان
            </div>

            <button
                id="refreshOrders"
                class="refresh"
            >
                🔄 بروزرسانی سفارش‌ها
            </button>

            <div
                id="ordersList"
                class="orders-list"
            ></div>

        </section>


        <section class="section">

            <div class="section-title">
                💰 ثبت فروش حضوری
            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        نام مشتری
                    </label>

                    <input
                        id="saleCustomerName"
                        class="input"
                        type="text"
                        placeholder="اختیاری"
                    >

                </div>


                <div class="form-group">

                    <label>
                        شماره تماس
                    </label>

                    <input
                        id="saleCustomerPhone"
                        class="input"
                        type="tel"
                        placeholder="اختیاری"
                    >

                </div>


                <div class="form-group">

                    <label>
                        محصول
                    </label>

                    <select
                        id="saleProduct"
                        class="input"
                    >
                        <option value="نان خانگی کنجدی">
                            نان خانگی کنجدی
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label>
                        وزن / تعداد
                    </label>

                    <input
                        id="saleWeight"
                        class="input"
                        type="number"
                        min="0"
                        step="0.1"
                        value="1"
                    >

                </div>


                <div class="form-group">

                    <label>
                        قیمت واحد
                    </label>

                    <input
                        id="salePrice"
                        class="input"
                        type="number"
                        min="0"
                        value="15000"
                    >

                </div>


                <div class="form-group">

                    <label>
                        روش پرداخت
                    </label>

                    <select
                        id="paymentMethod"
                        class="input"
                    >

                        <option value="نقدی">
                            نقدی
                        </option>

                        <option value="کارت">
                            کارت
                        </option>

                        <option value="پرداخت نشده">
                            پرداخت نشده
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        توضیحات
                    </label>

                    <textarea
                        id="saleDescription"
                        class="input"
                        placeholder="توضیحات فروش..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <div
                        id="saleTotal"
                        class="sale-total"
                    >
                        مبلغ کل: ۱۵٬۰۰۰ تومان
                    </div>

                </div>


                <div class="form-group full">

                    <button
                        id="saveSale"
                        class="btn btn-primary"
                    >
                        ثبت فروش حضوری
                    </button>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="section-title">
                📊 فروش‌های ثبت‌شده
            </div>

            <div
                id="salesList"
                class="orders-list"
            ></div>

        </section>

    </main>

</div>


<script>

const API = "";

let authToken =
    localStorage.getItem(
        "nanak_admin_token"
    );


function formatNumber(number) {

    return Number(number || 0)
        .toLocaleString("fa-IR");

}


function showMessage(
    text,
    type = "success"
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;

    setTimeout(function() {
        box.className = "message";
    }, 4000);

}


async function apiRequest(
    endpoint,
    options = {}
) {

    options.headers =
        options.headers || {};

    options.headers[
        "Content-Type"
    ] = "application/json";

    if (authToken) {

        options.headers[
            "Authorization"
        ] =
            "Bearer " + authToken;
    }

    const response =
        await fetch(
            API + endpoint,
            options
        );

    let data = {};

    try {
        data = await response.json();
    } catch (error) {
        data = {};
    }

    if (response.status === 401) {

        logout();

        throw new Error(
            "دسترسی شما منقضی شده است."
        );
    }

    if (!response.ok) {

        throw new Error(
            data.message ||
            "خطا در ارتباط با سرور"
        );
    }

    return data;
}


async function login() {

    const password =
        document.getElementById(
            "passwordInput"
        ).value.trim();

    const errorBox =
        document.getElementById(
            "loginError"
        );

    errorBox.textContent = "";

    if (!password) {

        errorBox.textContent =
            "رمز را وارد کنید.";

        return;
    }

    try {

        const response =
            await fetch(
                API + "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password:
                            password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            errorBox.textContent =
                data.message ||
                "رمز اشتباه است.";

            return;
        }

        authToken =
            data.token;

        localStorage.setItem(
            "nanak_admin_token",
            authToken
        );

        showDashboard();

    } catch (error) {

        errorBox.textContent =
            "اتصال به سرور برقرار نشد.";

        console.error(error);
    }
}


function logout() {

    authToken = null;

    localStorage.removeItem(
        "nanak_admin_token"
    );

    document.getElementById(
        "dashboard"
    ).style.display = "none";

    document.getElementById(
        "loginPage"
    ).style.display = "flex";

    document.getElementById(
        "passwordInput"
    ).value = "";

}


async function showDashboard() {

    document.getElementById(
        "loginPage"
    ).style.display = "none";

    document.getElementById(
        "dashboard"
    ).style.display = "block";

    await loadProducts();

    await loadOrders();

    await loadSales();

}


async function checkLogin() {

    if (!authToken) {
        return;
    }

    try {

        const data =
            await apiRequest(
                "/api/admin/check"
            );

        if (data.success) {
            showDashboard();
        }

    } catch (error) {

        console.log(
            "Login check:",
            error.message
        );

    }
}


async function loadProducts() {

    try {

        const data =
            await apiRequest(
                "/api/products"
            );

        const products =
            data.products || [];

        const container =
            document.getElementById(
                "productsList"
            );

        if (!products.length) {

            container.innerHTML =
                '<div class="empty">محصولی وجود ندارد.</div>';

            return;
        }

        container.innerHTML =
            products.map(
                function(product) {

                    const statusClass =
                        product.available
                            ? "available"
                            : "unavailable";

                    const statusText =
                        product.available
                            ? "موجود"
                            : "ناموجود";

                    return `
                        <div class="product-card">

                            <div>

                                <div class="product-name">
                                    🍞 ${escapeHtml(product.name)}
                                </div>

                                <div class="product-price">
                                    ${formatNumber(product.price)}
                                    تومان
                                </div>

                                <span class="status ${statusClass}">
                                    ${statusText}
                                </span>

                            </div>

                            <div class="product-actions">

                                <button
                                    class="small-btn ${product.available ? "orange" : "green"}"
                                    onclick="toggleProduct(
                                        '${escapeJs(product.id)}',
                                        ${!product.available}
                                    )"
                                >
                                    ${product.available
                                        ? "ناموجود کردن"
                                        : "موجود کردن"}
                                </button>

                            </div>

                        </div>
                    `;
                }
            )
            .join("");

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


async function toggleProduct(
    id,
    available
) {

    try {

        await apiRequest(
            "/api/products",
            {
                method: "PUT",

                body: JSON.stringify({
                    id: id,
                    available:
                        available
                })
            }
        );

        showMessage(
            available
                ? "محصول موجود شد."
                : "محصول ناموجود شد."
        );

        await loadProducts();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


async function loadOrders() {

    try {

        const data =
            await apiRequest(
                "/api/orders"
            );

        const orders =
            data.orders || [];

        document.getElementById(
            "totalOrders"
        ).textContent =
            formatNumber(
                orders.length
            );

        document.getElementById(
            "newOrders"
        ).textContent =
            formatNumber(
                orders.filter(
                    function(order) {
                        return order.status === "جدید";
                    }
                ).length
            );

        const container =
            document.getElementById(
                "ordersList"
            );

        if (!orders.length) {

            container.innerHTML =
                '<div class="empty">هنوز سفارشی ثبت نشده است.</div>';

            return;
        }

        container.innerHTML =
            orders.map(
                function(order) {

                    return `
                        <div class="order">

                            <div class="order-top">

                                <div class="order-number">
                                    ${escapeHtml(order.orderNumber)}
                                </div>

                                <div class="order-status">
                                    ${escapeHtml(order.status || "جدید")}
                                </div>

                            </div>

                            <div class="order-grid">

                                <div>
                                    👤
                                    ${escapeHtml(order.customerName)}
                                </div>

                                <div>
                                    📞
                                    ${escapeHtml(order.customerPhone)}
                                </div>

                                <div>
                                    🍞
                                    ${escapeHtml(order.product)}
                                </div>

                                <div>
                                    🔢
                                    تعداد:
                                    ${formatNumber(order.quantity)}
                                </div>

                                <div>
                                    💵
                                    قیمت واحد:
                                    ${formatNumber(order.unitPrice)}
                                </div>

                                <div>
                                    🕐
                                    ${escapeHtml(order.date)}
                                </div>

                            </div>

                            <div class="order-total">
                                مبلغ کل:
                                ${formatNumber(order.total)}
                                تومان
                            </div>

                            <div class="order-actions">

                                <button
                                    class="small-btn blue"
                                    onclick="changeOrderStatus(
                                        '${escapeJs(order.orderNumber)}',
                                        'جدید'
                                    )"
                                >
                                    جدید
                                </button>

                                <button
                                    class="small-btn orange"
                                    onclick="changeOrderStatus(
                                        '${escapeJs(order.orderNumber)}',
                                        'در حال آماده‌سازی'
                                    )"
                                >
                                    در حال آماده‌سازی
                                </button>

                                <button
                                    class="small-btn green"
                                    onclick="changeOrderStatus(
                                        '${escapeJs(order.orderNumber)}',
                                        'آماده تحویل'
                                    )"
                                >
                                    آماده تحویل
                                </button>

                                <button
                                    class="small-btn"
                                    style="background:#555;color:white"
                                    onclick="changeOrderStatus(
                                        '${escapeJs(order.orderNumber)}',
                                        'تحویل شد'
                                    )"
                                >
                                    تحویل شد
                                </button>

                            </div>

                        </div>
                    `;
                }
            )
            .join("");

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


async function changeOrderStatus(
    orderNumber,
    status
) {

    try {

        await apiRequest(
            "/api/orders/" +
            encodeURIComponent(
                orderNumber
            ),
            {
                method: "PUT",

                body: JSON.stringify({
                    status: status
                })
            }
        );

        showMessage(
            "وضعیت سفارش تغییر کرد."
        );

        await loadOrders();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


async function loadSales() {

    try {

        const data =
            await apiRequest(
                "/api/sales"
            );

        const sales =
            data.sales || [];

        document.getElementById(
            "totalSales"
        ).textContent =
            formatNumber(
                sales.length
            );

        const totalMoney =
            sales.reduce(
                function(sum, sale) {
                    return sum +
                        Number(
                            sale.total || 0
                        );
                },
                0
            );

        document.getElementById(
            "totalMoney"
        ).textContent =
            formatNumber(
                totalMoney
            );

        const container =
            document.getElementById(
                "salesList"
            );

        if (!sales.length) {

            container.innerHTML =
                '<div class="empty">هنوز فروش حضوری ثبت نشده است.</div>';

            return;
        }

        container.innerHTML =
            sales.map(
                function(sale) {

                    return `
                        <div class="order">

                            <div class="order-top">

                                <div>
                                    👤
                                    ${escapeHtml(
                                        sale.customerName ||
                                        "مشتری حضوری"
                                    )}
                                </div>

                                <div class="order-status">
                                    ${escapeHtml(
                                        sale.paymentMethod
                                    )}
                                </div>

                            </div>

                            <div class="order-grid">

                                <div>
                                    🍞
                                    ${escapeHtml(
                                        sale.product
                                    )}
                                </div>

                                <div>
                                    ⚖️
                                    وزن/تعداد:
                                    ${formatNumber(
                                        sale.weight
                                    )}
                                </div>

                                <div>
                                    💵
                                    قیمت واحد:
                                    ${formatNumber(
                                        sale.pricePerUnit
                                    )}
                                </div>

                                <div>
                                    🕐
                                    ${escapeHtml(
                                        sale.date
                                    )}
                                </div>

                            </div>

                            <div class="order-total">
                                مبلغ:
                                ${formatNumber(
                                    sale.total
                                )}
                                تومان
                            </div>

                        </div>
                    `;
                }
            )
            .join("");

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


function calculateSaleTotal() {

    const weight =
        Number(
            document.getElementById(
                "saleWeight"
            ).value
        ) || 0;

    const price =
        Number(
            document.getElementById(
                "salePrice"
            ).value
        ) || 0;

    const total =
        weight * price;

    document.getElementById(
        "saleTotal"
    ).textContent =
        "مبلغ کل: " +
        formatNumber(total) +
        " تومان";
}


async function saveSale() {

    const customerName =
        document.getElementById(
            "saleCustomerName"
        ).value.trim();

    const customerPhone =
        document.getElementById(
            "saleCustomerPhone"
        ).value.trim();

    const product =
        document.getElementById(
            "saleProduct"
        ).value;

    const weight =
        Number(
            document.getElementById(
                "saleWeight"
            ).value
        ) || 0;

    const pricePerUnit =
        Number(
            document.getElementById(
                "salePrice"
            ).value
        ) || 0;

    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        ).value;

    const description =
        document.getElementById(
            "saleDescription"
        ).value.trim();

    const total =
        weight * pricePerUnit;

    if (weight <= 0) {

        showMessage(
            "وزن یا تعداد را وارد کنید.",
            "error"
        );

        return;
    }

    if (pricePerUnit < 0) {

        showMessage(
            "قیمت نامعتبر است.",
            "error"
        );

        return;
    }

    try {

        await apiRequest(
            "/api/sales",
            {
                method: "POST",

                body: JSON.stringify({

                    customerName:
                        customerName,

                    customerPhone:
                        customerPhone,

                    product:
                        product,

                    weight:
                        weight,

                    pricePerUnit:
                        pricePerUnit,

                    total:
                        total,

                    paymentMethod:
                        paymentMethod,

                    description:
                        description
                })
            }
        );

        showMessage(
            "فروش حضوری با موفقیت ثبت شد."
        );

        document.getElementById(
            "saleCustomerName"
        ).value = "";

        document.getElementById(
            "saleCustomerPhone"
        ).value = "";

        document.getElementById(
            "saleDescription"
        ).value = "";

        await loadSales();

    } catch (error) {

        showMessage(
            error.message,
            "error"
        );
    }
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeJs(value) {

    return String(
        value ?? ""
    )
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}
